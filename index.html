<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitForge</title>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti Library for Workout Celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  
  <link rel="apple-touch-icon" href="Untitled%20design.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"FitForge","short_name":"FitForge","display":"standalone","background_color":"#000000","theme_color":"#000000"}'>

  <style>
    @keyframes flipbook {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .animate-flip {
      animation: flipbook 1.5s infinite;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="antialiased overflow-x-hidden transition-colors duration-300">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const FALLBACK_EXERCISE_DB = [
      { id: 'l1', name: 'Bodyweight Squats', category: 'Lower', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 12, imageStart: null, imageEnd: null },
      { id: 'l2', name: 'Reverse Lunges', category: 'Lower', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 10, imageStart: null, imageEnd: null },
      { id: 'u1', name: 'Push-ups', category: 'Upper', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 10, imageStart: null, imageEnd: null },
      { id: 'u3', name: 'Pull-ups', category: 'Upper', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 6, imageStart: null, imageEnd: null },
      { id: 'c1', name: 'Plank', category: 'Core', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 45, imageStart: null, imageEnd: null },
      { id: 'f1', name: 'Jumping Jacks', category: 'Full', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 30, imageStart: null, imageEnd: null }
    ];

    const MUSCLE_FILTERS = ['All', 'Upper', 'Lower', 'Core', 'Full'];
    const EQUIPMENT_FILTERS = ['All', 'Bodyweight', 'Dumbbells', 'Full Gym'];

    const THEMES = {
      health: {
        bg: 'bg-[#F2F2F7]', card: 'bg-white', text: 'text-black', subtext: 'text-[#8E8E93]',
        accent: 'bg-[#FF2D55]', accentText: 'text-[#FF2D55]', accentBorder: 'border-[#FF2D55]',
        border: 'border-[#E5E5EA]', input: 'bg-[#F2F2F7] text-black border-[#E5E5EA] focus:border-[#FF2D55]',
        doneBtnActive: 'bg-[#FF2D55] text-white', doneBtnInactive: 'bg-[#F2F2F7] text-[#8E8E93]',
        modalOverlay: 'bg-white/95'
      },
      fitness: {
        bg: 'bg-black', card: 'bg-[#1C1C1E]', text: 'text-white', subtext: 'text-[#8E8E93]',
        accent: 'bg-[#C4FF00]', accentText: 'text-[#C4FF00]', accentBorder: 'border-[#C4FF00]',
        border: 'border-[#38383A]', input: 'bg-[#2C2C2E] text-white border-[#38383A] focus:border-[#C4FF00]',
        doneBtnActive: 'bg-[#C4FF00] text-black', doneBtnInactive: 'bg-[#2C2C2E] text-[#8E8E93]',
        modalOverlay: 'bg-black/95'
      }
    };

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
      });
      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {}
      };
      return [storedValue, setValue];
    }

    // Helper to pick 3 unique random numbers between 1 and 20
    function generateSecretWinningSlots() {
      const slots = new Set();
      while (slots.size < 3) {
        slots.add(Math.floor(Math.random() * 20) + 1);
      }
      return Array.from(slots).sort((a, b) => a - b);
    }

    function App() {
      const [currentView, setCurrentView] = useState('setup');
      const [themeMode, setThemeMode] = useLocalStorage('fitforge_theme', 'fitness');
      
      // Kid Profile & Parent Phone Settings
      const [profile, setProfile] = useLocalStorage('fitforge_profile', { kidName: '', parentPhone: '' });
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      // Weight/Rep memory per exercise
      const [exerciseHistory, setExerciseHistory] = useLocalStorage('fitbod_history', {}); 
      
      // Full Workout Log History
      const [workoutLogs, setWorkoutLogs] = useLocalStorage('fitforge_workout_logs', []);

      // 20-Workout Mystery Reward Cycle State
      const [rewardCycle, setRewardCycle] = useLocalStorage('fitforge_reward_cycle', {
        currentCount: 0,
        winningSlots: generateSecretWinningSlots(),
        rewardsWonThisCycle: 0
      });
      const [lastSummaryResult, setLastSummaryResult] = useState(null);

      const [exerciseDB, setExerciseDB] = useState(FALLBACK_EXERCISE_DB);
      const [dbLoaded, setDbLoaded] = useState(false);
      
      // Default to 20 minutes for daily kid workouts
      const [timeMode, setTimeMode] = useState(20);
      const [focusArea, setFocusArea] = useState('Full Body');
      const [equipment, setEquipment] = useState('Bodyweight'); 
      const [workoutPlan, setWorkoutPlan] = useState([]);
      const [workoutStartTime, setWorkoutStartTime] = useState(null);
      const [restEndTime, setRestEndTime] = useState(null);
      const [restRemainingMs, setRestRemainingMs] = useState(0);
      const [liveTimer, setLiveTimer] = useState("00:00");
      const [swipeState, setSwipeState] = useState({ id: null, startX: 0, currentX: 0 });

      const [exerciseModal, setExerciseModal] = useState({ isOpen: false, type: null, targetIdx: null });
      const [searchQuery, setSearchQuery] = useState('');
      const [filterMuscle, setFilterMuscle] = useState('All');
      const [filterEquipment, setFilterEquipment] = useState('All');

      const t = THEMES[themeMode];
      
      useEffect(() => {
        document.body.className = `antialiased overflow-x-hidden transition-colors duration-300 ${t.bg}`;
      }, [themeMode]);

      // Prompt settings on first launch if name/phone aren't set
      useEffect(() => {
        if (!profile.kidName || !profile.parentPhone) {
          setShowSettingsModal(true);
        }
      }, []);

      // Fetch ExerciseDB
      useEffect(() => {
        fetch('https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) {
              const mappedDB = data.map((ex, i) => {
                let cat = 'Full';
                if (ex.primaryMuscles && ex.primaryMuscles.length > 0) {
                  const m = ex.primaryMuscles[0].toLowerCase();
                  if (['chest', 'shoulders', 'triceps', 'biceps', 'lats', 'middle back', 'lower back', 'traps'].includes(m)) cat = 'Upper';
                  else if (['abdominals'].includes(m)) cat = 'Core';
                  else if (['quadriceps', 'hamstrings', 'calves', 'glutes'].includes(m)) cat = 'Lower';
                }
                
                let eq = 'Full Gym';
                if (ex.equipment === 'body only') eq = 'Bodyweight';
                else if (ex.equipment === 'dumbbell') eq = 'Dumbbells';

                let imageStart = null;
                let imageEnd = null;
                if (ex.images && ex.images.length > 0) {
                  imageStart = `https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/${ex.images[0]}`;
                  if (ex.images.length > 1) {
                    imageEnd = `https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/${ex.images[1]}`;
                  }
                }

                return {
                  id: ex.id || `edb-${i}`,
                  name: ex.name.charAt(0).toUpperCase() + ex.name.slice(1),
                  category: cat,
                  equipment: eq,
                  defaultSets: 3,
                  defaultReps: 10,
                  imageStart: imageStart,
                  imageEnd: imageEnd
                };
              });
              setExerciseDB(mappedDB);
            }
            setDbLoaded(true);
          })
          .catch(() => setDbLoaded(true));
      }, []);

      useEffect(() => {
        let interval;
        if (currentView === 'workout' && workoutStartTime) {
          interval = setInterval(() => {
            const diff = Math.floor((Date.now() - workoutStartTime) / 1000);
            const mins = String(Math.floor(diff / 60)).padStart(2, '0');
            const secs = String(diff % 60).padStart(2, '0');
            setLiveTimer(`${mins}:${secs}`);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [currentView, workoutStartTime]);

      const generateWorkout = () => {
        let pool = exerciseDB.filter(ex => {
          if (equipment === 'Bodyweight' && ex.equipment !== 'Bodyweight') return false;
          if (equipment === 'Dumbbells' && ex.equipment === 'Full Gym') return false;
          if (focusArea === 'Upper Body' && ex.category !== 'Upper') return false;
          if (focusArea === 'Lower Body' && ex.category !== 'Lower') return false;
          if (focusArea === 'Core Focus' && ex.category !== 'Core') return false;
          return true;
        });

        pool.sort(() => Math.random() - 0.5);
        const maxExercises = Math.max(3, Math.floor(timeMode / 6));
        let selected = [];
        
        if (focusArea === 'Full Body') {
          const upper = pool.find(e => e.category === 'Upper');
          const lower = pool.find(e => e.category === 'Lower');
          const core = pool.find(e => e.category === 'Core');
          if (upper) selected.push(upper);
          if (lower) selected.push(lower);
          if (core) selected.push(core);
          for (const ex of pool) {
            if (selected.length >= maxExercises) break;
            if (!selected.includes(ex)) selected.push(ex);
          }
        } else {
          selected = pool.slice(0, maxExercises);
        }

        setWorkoutPlan(selected.map(ex => generateWorkoutExercise(ex)));
        setWorkoutStartTime(Date.now());
        setCurrentView('workout');
      };

      const generateWorkoutExercise = (exerciseDef) => {
        const pastData = exerciseHistory[exerciseDef.id] || { weight: '', reps: exerciseDef.defaultReps };
        const sets = Array.from({ length: exerciseDef.defaultSets }).map((_, i) => ({
          id: `${exerciseDef.id}-${Date.now()}-s${i}`, weight: pastData.weight, reps: pastData.reps, completed: false
        }));
        return {
          ...exerciseDef, instanceId: `${exerciseDef.id}-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
          isExpanded: true, supersetId: null, sets
        };
      };

      const toggleSuperset = (idx) => {
        const nextIdx = idx + 1;
        if (nextIdx >= workoutPlan.length) return;
        const updated = [...workoutPlan];
        const currentEx = updated[idx];
        const nextEx = updated[nextIdx];

        if (currentEx.supersetId && currentEx.supersetId === nextEx.supersetId) {
          nextEx.supersetId = null;
          const othersInGroup = updated.filter((e, i) => i !== idx && e.supersetId === currentEx.supersetId);
          if (othersInGroup.length === 0) currentEx.supersetId = null;
        } else {
          const newId = currentEx.supersetId || `ss-${Date.now()}`;
          currentEx.supersetId = newId; nextEx.supersetId = newId;
        }
        setWorkoutPlan(updated);
      };

      const isLinkedToNext = (idx) => idx < workoutPlan.length - 1 && workoutPlan[idx].supersetId && workoutPlan[idx].supersetId === workoutPlan[idx+1].supersetId;
      const toggleSetExpansion = (exIdx) => { const updated = [...workoutPlan]; updated[exIdx].isExpanded = !updated[exIdx].isExpanded; setWorkoutPlan(updated); };
      const updateSetData = (exIdx, setIdx, field, value) => { const updated = [...workoutPlan]; updated[exIdx].sets[setIdx][field] = value; setWorkoutPlan(updated); };

      const toggleSetComplete = (exIdx, setIdx) => {
        const updated = [...workoutPlan];
        const isNowComplete = !updated[exIdx].sets[setIdx].completed;
        updated[exIdx].sets[setIdx].completed = isNowComplete;
        setWorkoutPlan(updated);

        if (isNowComplete) {
          const currentEx = updated[exIdx];
          let shouldStartTimer = true;
          if (currentEx.supersetId) {
            const ssGroup = updated.filter(e => e.supersetId === currentEx.supersetId);
            if (currentEx.instanceId !== ssGroup[ssGroup.length - 1].instanceId) shouldStartTimer = false;
          }
          if (shouldStartTimer) startRestTimer(60);
          
          const completedSet = currentEx.sets[setIdx];
          if (completedSet.weight || completedSet.reps) {
            setExerciseHistory(prev => ({ ...prev, [currentEx.id]: { weight: completedSet.weight, reps: completedSet.reps } }));
          }
        }
      };

      const addSet = (exIdx) => {
        const updated = [...workoutPlan]; const currentEx = updated[exIdx]; const lastSet = currentEx.sets[currentEx.sets.length - 1];
        currentEx.sets.push({ id: `${currentEx.id}-s${Date.now()}`, weight: lastSet ? lastSet.weight : '', reps: lastSet ? lastSet.reps : currentEx.defaultReps, completed: false });
        setWorkoutPlan(updated);
      };

      const removeSet = (exIdx, setIdx) => {
        const updated = [...workoutPlan];
        updated[exIdx].sets.splice(setIdx, 1);
        setWorkoutPlan(updated);
      };

      const handleSwipeStart = (e, setId) => setSwipeState({ id: setId, startX: e.touches[0].clientX, currentX: e.touches[0].clientX });
      const handleSwipeMove = (e, setId) => {
        if (swipeState.id === setId) {
          const currentX = e.touches[0].clientX;
          if (currentX < swipeState.startX) setSwipeState(prev => ({ ...prev, currentX }));
        }
      };
      const handleSwipeEnd = (exIdx, setIdx, setId) => {
        const deltaX = swipeState.currentX - swipeState.startX;
        if (deltaX < -75) removeSet(exIdx, setIdx);
        setSwipeState({ id: null, startX: 0, currentX: 0 });
      };

      const handleSelectExercise = (newExerciseDef) => {
        const newExercise = generateWorkoutExercise(newExerciseDef);
        const updated = [...workoutPlan];
        if (exerciseModal.type === 'SWAP' && exerciseModal.targetIdx !== null) {
          newExercise.supersetId = updated[exerciseModal.targetIdx].supersetId;
          updated[exerciseModal.targetIdx] = newExercise;
        } else if (exerciseModal.type === 'ADD') {
          updated.push(newExercise);
        }
        setWorkoutPlan(updated);
        setExerciseModal({ isOpen: false, type: null, targetIdx: null });
        setSearchQuery('');
      };

      const startRestTimer = (seconds) => { setRestEndTime(Date.now() + seconds * 1000); setRestRemainingMs(seconds * 1000); };
      const stopRestTimer = () => { setRestEndTime(null); setRestRemainingMs(0); };

      useEffect(() => {
        let interval;
        if (restEndTime) {
          interval = setInterval(() => {
            const now = Date.now(); const remaining = Math.max(0, restEndTime - now);
            setRestRemainingMs(remaining);
            if (remaining <= 0) {
              stopRestTimer();
              if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]);
            }
          }, 100);
        }
        return () => clearInterval(interval);
      }, [restEndTime]);

      // Trigger Confetti Celebration
      const triggerCelebration = (isJackpot) => {
        if (typeof window.confetti === 'function') {
          if (isJackpot) {
            // Massive multi-burst jackpot celebration
            const duration = 2500;
            const end = Date.now() + duration;
            (function frame() {
              window.confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#FFD700', '#00FF00', '#FF2D55'] });
              window.confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#FFD700', '#00FF00', '#FF2D55'] });
              if (Date.now() < end) requestAnimationFrame(frame);
            }());
          } else {
            // Standard workout completion confetti burst
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
        }
      };

      // Complete Workout, Log History, Evaluate Mystery Reward
      const handleFinishWorkout = () => {
        stopRestTimer();
        const elapsedMinutes = workoutStartTime ? Math.max(1, Math.round((Date.now() - workoutStartTime) / 60000)) : timeMode;
        
        // Advance punch card (1 to 20)
        const nextWorkoutNumber = rewardCycle.currentCount + 1;
        const wonReward = rewardCycle.winningSlots.includes(nextWorkoutNumber);
        const updatedRewardsWon = wonReward ? rewardCycle.rewardsWonThisCycle + 1 : rewardCycle.rewardsWonThisCycle;

        // Build detailed log entry
        const completedExercisesSummary = workoutPlan.map(ex => {
          const doneSets = ex.sets.filter(s => s.completed);
          return {
            name: ex.name,
            setsCompleted: doneSets.length > 0 ? doneSets.length : ex.sets.length
          };
        });

        const newLogEntry = {
          id: `log-${Date.now()}`,
          date: new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
          time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
          focusArea,
          duration: elapsedMinutes,
          workoutNumberInCycle: nextWorkoutNumber,
          wonReward,
          exercises: completedExercisesSummary
        };

        setWorkoutLogs(prev => [newLogEntry, ...prev]);

        // Check if 20-workout cycle is complete and needs reset for next time
        if (nextWorkoutNumber >= 20) {
          setRewardCycle({
            currentCount: 0,
            winningSlots: generateSecretWinningSlots(),
            rewardsWonThisCycle: 0
          });
        } else {
          setRewardCycle({
            currentCount: nextWorkoutNumber,
            winningSlots: rewardCycle.winningSlots,
            rewardsWonThisCycle: updatedRewardsWon
          });
        }

        setLastSummaryResult({
          elapsedMinutes,
          workoutNumber: nextWorkoutNumber,
          wonReward,
          rewardsWonThisCycle: updatedRewardsWon,
          cycleCompleted: nextWorkoutNumber >= 20,
          dateStamp: `${newLogEntry.date} at ${newLogEntry.time}`
        });

        setCurrentView('summary');
        setTimeout(() => triggerCelebration(wonReward), 150);
      };

      // Build iOS SMS deep link
      const getSmsLink = () => {
        const phone = (profile.parentPhone || '').replace(/[^0-9+]/g, '');
        const kid = profile.kidName || 'I';
        const num = lastSummaryResult ? lastSummaryResult.workoutNumber : '';
        const stamp = lastSummaryResult ? lastSummaryResult.dateStamp : '';
        const body = `🎉 FitForge Reward Alert! ${kid} just completed Workout #${num}/20 (${stamp}) and unlocked a mystery $5 reward! 💸💪`;
        return `sms:${phone}&body=${encodeURIComponent(body)}`;
      };

      const filteredModalDB = useMemo(() => {
        return exerciseDB.filter(ex => {
          const matchSearch = ex.name.toLowerCase().includes(searchQuery.toLowerCase());
          const matchMuscle = filterMuscle === 'All' || ex.category === filterMuscle;
          const matchEq = filterEquipment === 'All' || ex.equipment === filterEquipment;
          return matchSearch && matchMuscle && matchEq;
        });
      }, [exerciseDB, searchQuery, filterMuscle, filterEquipment]);

      const renderSetupView = () => (
        <div className={`flex flex-col h-full overflow-y-auto pb-8 ${t.bg}`}>
          <div className={`p-6 pt-10 pb-6 ${t.card} border-b ${t.border} rounded-b-[32px] mb-5 shadow-sm`}>
            <div className="flex justify-between items-center mb-3">
              <div>
                <h1 className={`text-3xl font-black tracking-tighter ${t.text} flex items-center gap-2`}>
                  Fit<span className={t.accentText}>Forge</span>
                </h1>
                <p className={`${t.subtext} text-xs font-bold mt-0.5`}>
                  {profile.kidName ? `Welcome back, ${profile.kidName}!` : 'Daily Workout & Rewards'}
                </p>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setCurrentView('history')}
                  className={`text-xs font-bold px-3 py-2 rounded-full border ${t.border} ${t.text} flex items-center gap-1`}
                >
                  📅 History ({workoutLogs.length})
                </button>
                <button 
                  onClick={() => setShowSettingsModal(true)}
                  className={`p-2 rounded-full border ${t.border} ${t.text} text-xs`}
                  title="Settings"
                >
                  ⚙️
                </button>
              </div>
            </div>

            {/* 20-Workout Mystery Punch Card */}
            <div className={`mt-4 p-4 rounded-2xl border ${t.border} ${t.bg}`}>
              <div className="flex justify-between items-center mb-2">
                <span className={`text-xs font-black uppercase tracking-wider ${t.text}`}>
                  🎯 20-Workout Challenge
                </span>
                <span className={`text-xs font-black ${t.accentText}`}>
                  {rewardCycle.currentCount} / 20 Done
                </span>
              </div>
              
              {/* 20-dot visual grid */}
              <div className="grid grid-cols-10 gap-1.5 my-2.5">
                {Array.from({ length: 20 }).map((_, idx) => {
                  const slotNum = idx + 1;
                  const isDone = slotNum <= rewardCycle.currentCount;
                  return (
                    <div 
                      key={slotNum}
                      className={`h-6 rounded-md flex items-center justify-center text-[10px] font-black transition-all ${
                        isDone 
                          ? `${t.accent} ${themeMode === 'health' ? 'text-white' : 'text-black'}` 
                          : `${t.card} ${t.subtext} border ${t.border}`
                      }`}
                    >
                      {isDone ? '✓' : slotNum}
                    </div>
                  );
                })}
              </div>
              <div className="flex justify-between items-center text-[11px] font-bold mt-2">
                <span className={t.subtext}>3 hidden $5 rewards per 20 workouts</span>
                <span className="text-emerald-500 font-black">
                  💰 {rewardCycle.rewardsWonThisCycle}/3 Found
                </span>
              </div>
            </div>
          </div>
          
          <div className="space-y-6 px-6">
            <section>
              <h2 className={`text-xs font-bold uppercase tracking-wider ${t.subtext} mb-2.5`}>⏱️ Daily Goal Duration</h2>
              <div className={`flex ${t.card} rounded-xl p-1 border ${t.border}`}>
                {[20, 30, 45].map(time => (
                  <button key={time} onClick={() => setTimeMode(time)} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition-all ${timeMode === time ? `${t.accent} ${themeMode === 'health' ? 'text-white' : 'text-black'} shadow-sm` : `${t.subtext}`}`}>{time}m</button>
                ))}
              </div>
            </section>
            
            <section>
              <h2 className={`text-xs font-bold uppercase tracking-wider ${t.subtext} mb-2.5`}>🎯 Focus Area</h2>
              <div className="grid grid-cols-2 gap-2.5">
                {['Full Body', 'Upper Body', 'Lower Body', 'Core Focus'].map(f => (
                  <button key={f} onClick={() => setFocusArea(f)} className={`p-3.5 rounded-2xl flex flex-col items-start gap-1 border-2 transition-all ${focusArea === f ? `${t.accentBorder} ${t.card} ${t.accentText}` : `${t.border} ${t.card} ${t.subtext}`}`}>
                    <div className="font-bold text-sm">{f}</div>
                  </button>
                ))}
              </div>
            </section>
            
            <section>
              <h2 className={`text-xs font-bold uppercase tracking-wider ${t.subtext} mb-2.5`}>🏋️ Equipment</h2>
              <div className="flex gap-2">
                {['Bodyweight', 'Dumbbells', 'Full Gym'].map(eq => (
                  <button key={eq} onClick={() => setEquipment(eq)} className={`flex-1 py-3 rounded-xl font-bold text-xs text-center transition-all border ${equipment === eq ? `${t.accentBorder} ${t.card} ${t.accentText}` : `${t.card} ${t.subtext} ${t.border}`}`}>{eq}</button>
                ))}
              </div>
            </section>
            
            <button 
              onClick={generateWorkout} 
              disabled={!dbLoaded}
              className={`w-full ${!dbLoaded ? 'opacity-50' : ''} ${t.accent} ${themeMode === 'health' ? 'text-white' : 'text-black'} font-black text-lg py-4 rounded-2xl active:scale-95 transition-all mt-2 shadow-lg`}
            >
              {dbLoaded ? `START ${timeMode}-MIN WORKOUT` : 'LOADING DB...'}
            </button>
          </div>

          {/* Profile & Parent Setup Modal */}
          {showSettingsModal && (
            <div className={`absolute inset-0 z-50 ${t.modalOverlay} backdrop-blur-md flex flex-col justify-center p-6`}>
              <div className={`${t.card} border ${t.border} rounded-3xl p-6 shadow-2xl space-y-5`}>
                <div className="flex justify-between items-center">
                  <h2 className={`text-xl font-black ${t.text}`}>Player & Reward Setup</h2>
                  {profile.kidName && (
                    <button onClick={() => setShowSettingsModal(false)} className={`p-2 ${t.bg} ${t.text} rounded-full font-bold text-xs`}>✕</button>
                  )}
                </div>
                <p className={`text-xs ${t.subtext}`}>
                  Set up your name and your parent's cell number so you can text them when you unlock a mystery $5 reward!
                </p>

                <div>
                  <label className={`block text-xs font-bold uppercase ${t.subtext} mb-1.5`}>Your First Name</label>
                  <input 
                    type="text" 
                    placeholder="e.g. Presley or Lincoln"
                    value={profile.kidName}
                    onChange={(e) => setProfile({ ...profile, kidName: e.target.value })}
                    className={`w-full font-bold py-3 px-4 rounded-xl border focus:outline-none ${t.input}`}
                  />
                </div>

                <div>
                  <label className={`block text-xs font-bold uppercase ${t.subtext} mb-1.5`}>Parent's Phone Number</label>
                  <input 
                    type="tel" 
                    placeholder="e.g. 617-555-0199"
                    value={profile.parentPhone}
                    onChange={(e) => setProfile({ ...profile, parentPhone: e.target.value })}
                    className={`w-full font-bold py-3 px-4 rounded-xl border focus:outline-none ${t.input}`}
                  />
                </div>

                <div className="flex justify-between items-center pt-2">
                  <span className={`text-xs font-bold ${t.subtext}`}>App Theme</span>
                  <button 
                    onClick={() => setThemeMode(themeMode === 'health' ? 'fitness' : 'health')}
                    className={`text-xs font-bold px-3 py-1.5 rounded-full border ${t.border} ${t.text}`}
                  >
                    {themeMode === 'health' ? 'Switch to Dark Mode' : 'Switch to Light Mode'}
                  </button>
                </div>

                <button 
                  onClick={() => setShowSettingsModal(false)}
                  className={`w-full py-4 ${t.accent} ${themeMode === 'health' ? 'text-white' : 'text-black'} font-black rounded-xl text-sm`}
                >
                  SAVE SETTINGS
                </button>
              </div>
            </div>
          )}
        </div>
      );

      const renderHistoryView = () => (
        <div className={`flex flex-col h-full ${t.bg}`}>
          <header className={`flex justify-between items-center py-4 px-5 ${t.card} border-b ${t.border} sticky top-0 z-20`}>
            <div>
              <h2 className={`text-xl font-black ${t.text}`}>Workout Log</h2>
              <p className={`text-xs ${t.subtext} font-bold`}>{workoutLogs.length} Total Workouts Completed</p>
            </div>
            <button onClick={() => setCurrentView('setup')} className={`text-xs font-bold ${t.text} ${t.bg} border ${t.border} px-4 py-2 rounded-full`}>
              Done
            </button>
          </header>

          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {workoutLogs.length === 0 ? (
              <div className="text-center py-20 px-6">
                <div className="text-4xl mb-3">📋</div>
                <div className={`font-black text-lg ${t.text}`}>No Workouts Logged Yet</div>
                <p className={`text-xs ${t.subtext} mt-1`}>Complete your first 20-minute session to start tracking your progress and unlocking mystery $5 rewards!</p>
              </div>
            ) : (
              workoutLogs.map((log) => (
                <div key={log.id} className={`${t.card} border ${log.wonReward ? 'border-emerald-500' : t.border} rounded-2xl p-4 shadow-sm`}>
                  <div className="flex justify-between items-start mb-2">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className={`font-black text-sm ${t.text}`}>{log.focusArea}</span>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${t.bg} ${t.subtext}`}>
                          #{log.workoutNumberInCycle}/20
                        </span>
                      </div>
                      <div className={`text-xs ${t.subtext} mt-0.5`}>{log.date} • {log.time} • {log.duration} min</div>
                    </div>
                    {log.wonReward && (
                      <span className="bg-emerald-500/20 text-emerald-500 border border-emerald-500/40 text-[10px] font-black px-2.5 py-1 rounded-full">
                        💸 $5 WINNER
                      </span>
                    )}
                  </div>
                  
                  <div className={`mt-3 pt-2.5 border-t ${t.border} flex flex-wrap gap-1.5`}>
                    {log.exercises.map((ex, i) => (
                      <span key={i} className={`text-[11px] font-medium px-2.5 py-1 rounded-lg ${t.bg} ${t.text}`}>
                        {ex.name} ({ex.setsCompleted}x)
                      </span>
                    ))}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );

      const renderWorkoutView = () => {
        const isWorkoutComplete = workoutPlan.length > 0 && workoutPlan.every(ex => ex.sets.every(set => set.completed));
        const groupedWorkout = [];
        let currentGroup = null;
        
        workoutPlan.forEach((ex, idx) => {
          if (ex.supersetId) {
            if (currentGroup && currentGroup.supersetId === ex.supersetId) {
              currentGroup.items.push({ ...ex, originalIdx: idx });
            } else {
              currentGroup = { isSuperset: true, supersetId: ex.supersetId, items: [{ ...ex, originalIdx: idx }] };
              groupedWorkout.push(currentGroup);
            }
          } else {
            currentGroup = null; groupedWorkout.push({ isSuperset: false, items: [{ ...ex, originalIdx: idx }] });
          }
        });

        return (
          <div className={`flex flex-col h-full ${t.bg} relative`}>
            <header className={`flex justify-between items-center py-4 px-4 ${t.card} border-b ${t.border} sticky top-0 z-20 shadow-sm`}>
              <div>
                <h2 className={`text-lg font-black ${t.text}`}>{focusArea}</h2>
                <div className="flex items-center gap-2">
                  <p className={`text-xs ${t.subtext} font-bold`}>GOAL: {timeMode}M</p>
                  <span className={`text-xs ${t.accentText} font-black px-2 py-0.5 rounded border ${t.accentBorder}`}>{liveTimer}</span>
                </div>
              </div>
              <button onClick={handleFinishWorkout} className={`text-xs font-black ${themeMode === 'health' ? 'text-white' : 'text-black'} ${t.accent} px-4 py-2 rounded-full shadow-sm`}>
                Finish
              </button>
            </header>
            
            <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-40">
              {groupedWorkout.map((group) => (
                <div key={group.isSuperset ? group.supersetId : `single-${group.items[0].instanceId}`} className={group.isSuperset ? `border-l-4 ${t.accentBorder} pl-3 py-1 -ml-3 relative` : ""}>
                  {group.isSuperset && <div className={`text-[10px] font-black ${t.accentText} tracking-widest uppercase mb-2 flex items-center gap-1`}>🔗 SUPERSET</div>}
                  <div className="space-y-4">
                    {group.items.map((ex) => {
                      const exIdx = ex.originalIdx;
                      return (
                        <div key={ex.instanceId} className="relative">
                          <div className={`${t.card} border ${t.border} rounded-2xl shadow-sm transition-all overflow-hidden`}>
                            <div className={`p-4 ${themeMode === 'health' ? 'bg-gray-50' : 'bg-[#151516]'} flex justify-between items-center border-b ${t.border}`}>
                              <div className="flex-1 cursor-pointer flex items-center gap-3" onClick={() => toggleSetExpansion(exIdx)}>
                                <div className={`p-2 rounded-full text-xs font-bold ${ex.isExpanded ? `${t.bg} ${t.text}` : `${t.bg} ${t.subtext}`}`}>{ex.isExpanded ? '▲' : '▼'}</div>
                                <div><h3 className={`font-bold ${t.text} leading-tight`}>{ex.name}</h3><span className={`text-[10px] font-bold uppercase ${t.subtext}`}>{ex.category}</span></div>
                              </div>
                              <button onClick={() => setExerciseModal({ isOpen: true, type: 'SWAP', targetIdx: exIdx })} className={`ml-2 flex items-center gap-1 text-[10px] font-bold ${t.subtext} ${t.bg} border ${t.border} px-3 py-2 rounded-lg`}>🔄 SWAP</button>
                            </div>
                            
                            {ex.isExpanded && (
                              <div className="p-3 pb-4">
                                <div className={`w-full h-36 rounded-xl mb-4 flex flex-col items-center justify-center ${themeMode === 'health' ? 'bg-gray-100' : 'bg-[#151516]'} overflow-hidden relative border ${t.border}`}>
                                  {ex.imageStart && ex.imageEnd ? (
                                    <div className="relative w-full h-full">
                                      <img src={ex.imageEnd} alt={ex.name} className="absolute inset-0 object-cover w-full h-full opacity-70" />
                                      <img src={ex.imageStart} alt={ex.name} className="absolute inset-0 object-cover w-full h-full opacity-70 animate-flip" />
                                    </div>
                                  ) : ex.imageStart ? (
                                    <img src={ex.imageStart} alt={ex.name} className="object-cover w-full h-full opacity-70" />
                                  ) : (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                                      <span className="text-2xl mb-1">💪</span>
                                      <span className={`text-[10px] font-bold tracking-widest uppercase ${t.subtext}`}>{ex.equipment}</span>
                                    </div>
                                  )}
                                </div>
                                
                                <div className={`grid grid-cols-12 gap-2 px-3 py-2 text-[10px] font-bold ${t.subtext} uppercase tracking-wider`}>
                                  <div className="col-span-2 text-center">Set</div><div className="col-span-4 text-center">lbs</div><div className="col-span-4 text-center">Reps</div><div className="col-span-2 text-center">✔️</div>
                                </div>
                                
                                {ex.sets.map((set, setIdx) => {
                                  const isSwiping = swipeState.id === set.id;
                                  const swipeDelta = isSwiping ? Math.min(0, swipeState.currentX - swipeState.startX) : 0;
                                  
                                  return (
                                    <div key={set.id} className="relative mb-2 rounded-lg overflow-hidden">
                                      <div className="absolute inset-0 bg-[#FF3B30] flex justify-end items-center px-4 rounded-lg">
                                        <span className="text-white font-bold text-xs tracking-wider">DELETE</span>
                                      </div>
                                      
                                      <div 
                                        onTouchStart={(e) => handleSwipeStart(e, set.id)}
                                        onTouchMove={(e) => handleSwipeMove(e, set.id)}
                                        onTouchEnd={() => handleSwipeEnd(exIdx, setIdx, set.id)}
                                        style={{ transform: `translateX(${swipeDelta}px)`, transition: isSwiping ? 'none' : 'transform 0.2s ease' }}
                                        className={`relative z-10 grid grid-cols-12 gap-2 px-2 py-2 items-center rounded-lg ${t.card} ${set.completed ? 'opacity-60' : ''}`}
                                      >
                                        <div className={`col-span-2 text-center font-bold ${t.subtext} text-sm`}>{setIdx + 1}</div>
                                        <div className="col-span-4">
                                          <input 
                                            type="number" inputMode="decimal" pattern="[0-9]*" placeholder="BW" 
                                            value={set.weight} onChange={(e) => updateSetData(exIdx, setIdx, 'weight', e.target.value)} disabled={set.completed} 
                                            className={`w-full font-bold py-3 px-1 text-center rounded-lg border focus:outline-none transition-colors ${set.completed ? 'bg-transparent border-transparent' : t.input}`} 
                                          />
                                        </div>
                                        <div className="col-span-4">
                                          <input 
                                            type="number" inputMode="decimal" pattern="[0-9]*" placeholder="-" 
                                            value={set.reps} onChange={(e) => updateSetData(exIdx, setIdx, 'reps', e.target.value)} disabled={set.completed} 
                                            className={`w-full font-bold py-3 px-1 text-center rounded-lg border focus:outline-none transition-colors ${set.completed ? 'bg-transparent border-transparent' : t.input}`} 
                                          />
                                        </div>
                                        <div className="col-span-2 flex justify-center">
                                          <button onClick={() => toggleSetComplete(exIdx, setIdx)} className={`w-10 h-10 rounded-lg flex items-center justify-center font-bold transition-colors ${set.completed ? t.doneBtnActive : t.doneBtnInactive}`}>
                                            {set.completed && '✓'}
                                          </button>
                                        </div>
                                      </div>
                                    </div>
                                  );
                                })}
                                <div className="px-2 mt-4"><button onClick={() => addSet(exIdx)} className={`w-full py-3 text-xs font-bold ${t.subtext} ${t.bg} rounded-lg border border-dashed ${t.border}`}>+ ADD SET</button></div>
                              </div>
                            )}
                          </div>
                          {exIdx < workoutPlan.length - 1 && (
                            <div className="absolute -bottom-6 left-1/2 transform -translate-x-1/2 z-10 pb-2">
                              <button onClick={() => toggleSuperset(exIdx)} className={`p-1.5 rounded-full border shadow-sm ${isLinkedToNext(exIdx) ? `${t.accent} ${t.accentBorder}` : `${t.bg} ${t.border}`}`}>🔗</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
              <div className="mt-8 pt-4"><button onClick={() => setExerciseModal({ isOpen: true, type: 'ADD', targetIdx: null })} className={`w-full py-4 border-2 border-dashed ${t.border} rounded-2xl ${t.subtext} font-bold flex justify-center items-center gap-2`}>➕ ADD EXERCISE</button></div>
              
              <button 
                onClick={handleFinishWorkout} 
                className={`w-full mt-6 py-5 ${t.accent} ${themeMode === 'health' ? 'text-white' : 'text-black'} font-black text-lg rounded-2xl shadow-lg active:scale-95 transition-all`}
              >
                {isWorkoutComplete ? '🎉 COMPLETE & LOG WORKOUT' : 'COMPLETE & LOG WORKOUT'}
              </button>
            </div>

            {restRemainingMs > 0 && (
              <div className={`fixed bottom-6 left-4 right-4 ${t.card} border ${t.border} p-4 rounded-2xl shadow-2xl flex items-center justify-between z-40 backdrop-blur-md`}>
                <div className="flex items-center gap-3">
                  <div className={`w-10 h-10 ${t.accent} bg-opacity-20 ${t.accentText} rounded-full flex items-center justify-center animate-pulse`}>⏱️</div>
                  <div><div className={`text-xs font-bold ${t.subtext} uppercase`}>Rest Timer</div><div className={`text-2xl font-black ${t.text} leading-none`}>{Math.floor(restRemainingMs / 1000)}s</div></div>
                </div>
                <button onClick={stopRestTimer} className={`px-6 py-3 ${t.bg} ${t.text} font-bold text-sm rounded-xl border ${t.border}`}>Skip</button>
                <div className={`absolute bottom-0 left-0 h-1 ${t.accent} rounded-b-2xl transition-all`} style={{ width: `${(restRemainingMs / 60000) * 100}%` }} />
              </div>
            )}

            {exerciseModal.isOpen && (
              <div className={`absolute inset-0 z-50 ${t.modalOverlay} backdrop-blur-md flex flex-col`}>
                <header className={`flex justify-between items-center p-4 border-b ${t.border} ${t.card}`}>
                  <h2 className={`text-lg font-black ${t.text}`}>{exerciseModal.type === 'SWAP' ? 'Swap Exercise' : 'Add Exercise'}</h2>
                  <button onClick={() => setExerciseModal({ isOpen: false, type: null, targetIdx: null })} className={`p-2 ${t.bg} ${t.text} rounded-full font-bold`}>X</button>
                </header>
                
                <div className={`p-4 border-b ${t.border} ${t.card}`}>
                  <input 
                    type="text" 
                    placeholder="Search exercises..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className={`w-full font-bold py-3 px-4 rounded-xl border focus:outline-none transition-colors ${t.input} mb-4`} 
                  />
                  
                  <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                    {MUSCLE_FILTERS.map(m => (
                      <button 
                        key={m} 
                        onClick={() => setFilterMuscle(m)}
                        className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border transition-colors ${filterMuscle === m ? `${t.accent} ${themeMode === 'health' ? 'text-white' : 'text-black'} ${t.accentBorder}` : `${t.bg} ${t.subtext} ${t.border}`}`}
                      >
                        {m}
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-2 overflow-x-auto mt-2 scrollbar-hide">
                    {EQUIPMENT_FILTERS.map(eq => (
                      <button 
                        key={eq} 
                        onClick={() => setFilterEquipment(eq)}
                        className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border transition-colors ${filterEquipment === eq ? `${t.accent} ${themeMode === 'health' ? 'text-white' : 'text-black'} ${t.accentBorder}` : `${t.bg} ${t.subtext} ${t.border}`}`}
                      >
                        {eq}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                  <div className={`text-xs ${t.subtext} font-bold uppercase tracking-wider mb-4`}>
                    {filteredModalDB.length} Exercises Found
                  </div>
                  {filteredModalDB.map(alt => (
                    <button key={alt.id} onClick={() => handleSelectExercise(alt)} className={`w-full text-left ${t.card} border ${t.border} p-4 rounded-xl flex justify-between items-center`}>
                      <div className="flex items-center gap-3">
                        {alt.imageStart ? (
                           <div className={`w-12 h-12 rounded-md overflow-hidden bg-gray-100 flex-shrink-0 border ${t.border}`}>
                              <img src={alt.imageStart} className="w-full h-full object-cover" alt="" />
                           </div>
                        ) : (
                           <div className={`w-12 h-12 rounded-md flex-shrink-0 flex items-center justify-center ${t.bg} border ${t.border} text-[10px]`}>💪</div>
                        )}
                        <div><div className={`font-bold ${t.text}`}>{alt.name}</div><div className={`text-xs ${t.subtext} mt-1`}>{alt.category} • {alt.equipment}</div></div>
                      </div>
                      <div className={`${t.accentText} font-bold`}>{exerciseModal.type === 'SWAP' ? '🔄' : '➕'}</div>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderSummaryView = () => {
        const res = lastSummaryResult || { elapsedMinutes: 20, workoutNumber: 1, wonReward: false, rewardsWonThisCycle: 0, cycleCompleted: false };
        
        return (
          <div className={`flex flex-col h-full ${t.bg} p-6 justify-center items-center text-center overflow-y-auto`}>
            
            {res.wonReward ? (
              <div className="animate-pop w-full max-w-sm">
                <div className="w-24 h-24 bg-emerald-500/20 text-emerald-400 rounded-full flex justify-center items-center mx-auto mb-5 border-4 border-emerald-500 text-5xl shadow-[0_0_40px_rgba(16,185,129,0.4)]">
                  💸
                </div>
                <div className="inline-block bg-emerald-500 text-black font-black text-xs uppercase tracking-widest px-3 py-1 rounded-full mb-3">
                  MYSTERY REWARD UNLOCKED!
                </div>
                <h2 className={`text-4xl font-black ${t.text} mb-2`}>YOU WON $5!</h2>
                <p className={`text-sm ${t.subtext} mb-6`}>
                  Workout #{res.workoutNumber} of 20 hit one of the 3 secret cash slots!
                </p>

                <a 
                  href={getSmsLink()}
                  className="w-full py-4 px-6 bg-emerald-500 hover:bg-emerald-400 text-black font-black text-base rounded-2xl flex justify-center items-center gap-2 shadow-xl mb-4 active:scale-95 transition-transform"
                >
                  📲 TEXT DAD TO CLAIM $5
                </a>
              </div>
            ) : (
              <div className="animate-pop w-full max-w-sm">
                <div className={`w-24 h-24 ${t.accent} bg-opacity-20 ${t.accentText} rounded-full flex justify-center items-center mx-auto mb-6 border-4 ${t.accentBorder} text-5xl`}>
                  🎉
                </div>
                <h2 className={`text-4xl font-black ${t.text} mb-2`}>Workout<br/>Complete!</h2>
                <p className={`text-sm ${t.subtext} mb-6`}>
                  {res.cycleCompleted 
                    ? "You finished all 20 workouts! A brand new 20-workout card with 3 new $5 rewards starts tomorrow!" 
                    : `Punch #${res.workoutNumber} of 20 logged! Keep going to find the remaining ${3 - res.rewardsWonThisCycle} mystery $5 rewards.`}
                </p>
              </div>
            )}

            <div className={`${t.card} border ${t.border} rounded-2xl p-5 w-full max-w-sm mb-8 shadow-sm grid grid-cols-2 divide-x ${t.border}`}>
              <div>
                <div className={`text-[10px] font-bold uppercase tracking-widest mb-1 ${t.subtext}`}>Time Logged</div>
                <div className={`text-2xl font-black ${t.text}`}>{res.elapsedMinutes} <span className={`text-xs ${t.subtext}`}>MIN</span></div>
              </div>
              <div>
                <div className={`text-[10px] font-bold uppercase tracking-widest mb-1 ${t.subtext}`}>Punch Card</div>
                <div className={`text-2xl font-black ${t.accentText}`}>{res.workoutNumber}<span className={`text-xs ${t.subtext}`}>/20</span></div>
              </div>
            </div>

            <button 
              onClick={() => setCurrentView('setup')} 
              className={`w-full max-w-sm py-4 ${t.card} ${t.text} font-black text-base rounded-2xl flex justify-center items-center gap-2 border ${t.border}`}
            >
              🏠 RETURN HOME
            </button>
          </div>
        );
      };

      return (
        <div className={`w-full min-h-screen ${t.bg} ${t.text} font-sans flex justify-center`}>
          <div className={`w-full max-w-md h-screen relative shadow-2xl overflow-hidden flex flex-col ${t.bg}`}>
            {currentView === 'setup' && renderSetupView()}
            {currentView === 'workout' && renderWorkoutView()}
            {currentView === 'history' && renderHistoryView()}
            {currentView === 'summary' && renderSummaryView()}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
