    // PASTE YOUR APP CODE HERE
    // (Everything starting from "const { useState, useEffect } = React;" down to the final import React, { useState, useEffect } from 'react';
import { 
  Clock, Activity, Dumbbell, Settings, Play, CheckCircle, 
  Home, RotateCcw, X, ArrowLeftRight, ChevronDown, ChevronUp, 
  Check, Flame, Plus, Link2, Unlink
} from 'lucide-react';

// --- FITBOD-STYLE EXERCISE DATABASE ---
const EXERCISE_DB = [
  // LOWER
  { id: 'l1', name: 'Barbell Back Squat', category: 'Lower', equipment: 'Full Gym', defaultSets: 3, defaultReps: 5 },
  { id: 'l2', name: 'Romanian Deadlift (RDL)', category: 'Lower', equipment: 'Full Gym', defaultSets: 3, defaultReps: 8 },
  { id: 'l3', name: 'Dumbbell Lunges', category: 'Lower', equipment: 'Dumbbells', defaultSets: 3, defaultReps: 12 },
  { id: 'l4', name: 'Leg Press', category: 'Lower', equipment: 'Full Gym', defaultSets: 3, defaultReps: 10 },
  { id: 'l5', name: 'Goblet Squat', category: 'Lower', equipment: 'Dumbbells', defaultSets: 3, defaultReps: 12 },
  { id: 'l6', name: 'Bulgarian Split Squat', category: 'Lower', equipment: 'Dumbbells', defaultSets: 3, defaultReps: 8 },
  { id: 'l7', name: 'Glute Bridge', category: 'Lower', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 15 },
  
  // UPPER
  { id: 'u1', name: 'Barbell Bench Press', category: 'Upper', equipment: 'Full Gym', defaultSets: 4, defaultReps: 5 },
  { id: 'u2', name: 'Incline DB Press', category: 'Upper', equipment: 'Dumbbells', defaultSets: 3, defaultReps: 10 },
  { id: 'u3', name: 'Pull-ups', category: 'Upper', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 8 },
  { id: 'u4', name: 'Lat Pulldown', category: 'Upper', equipment: 'Full Gym', defaultSets: 3, defaultReps: 10 },
  { id: 'u5', name: 'Overhead DB Press', category: 'Upper', equipment: 'Dumbbells', defaultSets: 3, defaultReps: 8 },
  { id: 'u6', name: 'Barbell Row', category: 'Upper', equipment: 'Full Gym', defaultSets: 3, defaultReps: 8 },
  { id: 'u7', name: 'Push-ups', category: 'Upper', equipment: 'Bodyweight', defaultSets: 4, defaultReps: 15 },
  { id: 'u8', name: 'Dips', category: 'Upper', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 10 },

  // CORE
  { id: 'c1', name: 'Cable Woodchops', category: 'Core', equipment: 'Full Gym', defaultSets: 3, defaultReps: 12 },
  { id: 'c2', name: 'Plank', category: 'Core', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 60 },
  { id: 'c3', name: 'Russian Twists', category: 'Core', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 20 },
  { id: 'c4', name: 'Hanging Leg Raises', category: 'Core', equipment: 'Full Gym', defaultSets: 3, defaultReps: 10 },
  { id: 'c5', name: 'Ab Wheel Rollout', category: 'Core', equipment: 'Full Gym', defaultSets: 3, defaultReps: 8 },

  // FULL BODY
  { id: 'f1', name: 'Kettlebell Swings', category: 'Full', equipment: 'Dumbbells', defaultSets: 4, defaultReps: 15 },
  { id: 'f2', name: 'Thrusters', category: 'Full', equipment: 'Dumbbells', defaultSets: 3, defaultReps: 10 },
  { id: 'f3', name: 'Burpees', category: 'Full', equipment: 'Bodyweight', defaultSets: 3, defaultReps: 15 },
  { id: 'f4', name: 'Power Cleans', category: 'Full', equipment: 'Full Gym', defaultSets: 5, defaultReps: 3 }
];

// CATEGORY ORDER FOR MODAL
const CATEGORIES = ['Lower', 'Upper', 'Core', 'Full'];

// --- CUSTOM HOOK FOR LOCAL STORAGE ---
function useLocalStorage(key, initialValue) {
  const [storedValue, setStoredValue] = useState(() => {
    try {
      const item = window.localStorage.getItem(key);
      return item ? JSON.parse(item) : initialValue;
    } catch (error) {
      return initialValue;
    }
  });

  const setValue = (value) => {
    try {
      const valueToStore = value instanceof Function ? value(storedValue) : value;
      setStoredValue(valueToStore);
      window.localStorage.setItem(key, JSON.stringify(valueToStore));
    } catch (error) {
      console.warn("localStorage error:", error);
    }
  };

  return [storedValue, setValue];
}

// --- MAIN APPLICATION COMPONENT ---
export default function App() {
  const [currentView, setCurrentView] = useState('setup'); // 'setup', 'workout', 'summary'
  
  // Persisted Data
  const [history, setHistory] = useLocalStorage('fitbod_history', {}); 

  // Setup State
  const [timeMode, setTimeMode] = useState(45);
  const [focusArea, setFocusArea] = useState('Full Body');
  const [equipment, setEquipment] = useState('Full Gym'); 

  // Active Workout State
  const [workoutPlan, setWorkoutPlan] = useState([]);
  const [workoutStartTime, setWorkoutStartTime] = useState(null);
  
  // Floating Rest Timer State
  const [restEndTime, setRestEndTime] = useState(null);
  const [restRemainingMs, setRestRemainingMs] = useState(0);

  // Modals
  // { isOpen: boolean, type: 'SWAP' | 'ADD', targetIdx: number | null }
  const [exerciseModal, setExerciseModal] = useState({ isOpen: false, type: null, targetIdx: null });

  // --- WORKOUT GENERATOR ---
  const generateWorkout = () => {
    let pool = EXERCISE_DB.filter(ex => {
      if (equipment === 'Bodyweight' && ex.equipment !== 'Bodyweight') return false;
      if (equipment === 'Dumbbells' && ex.equipment === 'Full Gym') return false;
      if (focusArea === 'Upper Body' && ex.category !== 'Upper') return false;
      if (focusArea === 'Lower Body' && ex.category !== 'Lower') return false;
      if (focusArea === 'Core Focus' && ex.category !== 'Core') return false;
      return true;
    });

    pool.sort(() => Math.random() - 0.5);
    const maxExercises = Math.max(2, Math.floor(timeMode / 8));
    
    let selected = [];
    if (focusArea === 'Full Body') {
      const upper = pool.find(e => e.category === 'Upper');
      const lower = pool.find(e => e.category === 'Lower');
      const core = pool.find(e => e.category === 'Core');
      if (upper) selected.push(upper);
      if (lower) selected.push(lower);
      if (core) selected.push(core);
      
      for (const ex of pool) {
        if (selected.length >= maxExercises) break;
        if (!selected.includes(ex)) selected.push(ex);
      }
    } else {
      selected = pool.slice(0, maxExercises);
    }

    const detailedPlan = selected.map(ex => generateWorkoutExercise(ex));

    setWorkoutPlan(detailedPlan);
    setWorkoutStartTime(Date.now());
    setCurrentView('workout');
  };

  const generateWorkoutExercise = (exerciseDef) => {
    const pastData = history[exerciseDef.id] || { weight: '', reps: exerciseDef.defaultReps };
    const sets = Array.from({ length: exerciseDef.defaultSets }).map((_, i) => ({
      id: `${exerciseDef.id}-${Date.now()}-s${i}`,
      weight: pastData.weight,
      reps: pastData.reps,
      completed: false
    }));

    return {
      ...exerciseDef,
      instanceId: `${exerciseDef.id}-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
      isExpanded: true,
      supersetId: null,
      sets
    };
  };

  // --- SUPERSET LOGIC ---
  const toggleSuperset = (idx) => {
    const nextIdx = idx + 1;
    if (nextIdx >= workoutPlan.length) return;
    
    const updated = [...workoutPlan];
    const currentEx = updated[idx];
    const nextEx = updated[nextIdx];

    if (currentEx.supersetId && currentEx.supersetId === nextEx.supersetId) {
      // Unlink them
      nextEx.supersetId = null;
      // If current is now alone in its superset, clear its ID too
      const othersInGroup = updated.filter((e, i) => i !== idx && e.supersetId === currentEx.supersetId);
      if (othersInGroup.length === 0) currentEx.supersetId = null;
    } else {
      // Link them
      const newId = currentEx.supersetId || `ss-${Date.now()}`;
      currentEx.supersetId = newId;
      nextEx.supersetId = newId;
    }
    
    setWorkoutPlan(updated);
  };

  const isLinkedToNext = (idx) => {
    if (idx >= workoutPlan.length - 1) return false;
    return workoutPlan[idx].supersetId && workoutPlan[idx].supersetId === workoutPlan[idx+1].supersetId;
  };

  // --- SET INTERACTION HANDLERS ---
  const toggleSetExpansion = (exIdx) => {
    const updated = [...workoutPlan];
    updated[exIdx].isExpanded = !updated[exIdx].isExpanded;
    setWorkoutPlan(updated);
  };

  const updateSetData = (exIdx, setIdx, field, value) => {
    const updated = [...workoutPlan];
    updated[exIdx].sets[setIdx][field] = value;
    setWorkoutPlan(updated);
  };

  const toggleSetComplete = (exIdx, setIdx) => {
    const updated = [...workoutPlan];
    const isNowComplete = !updated[exIdx].sets[setIdx].completed;
    updated[exIdx].sets[setIdx].completed = isNowComplete;
    
    setWorkoutPlan(updated);

    if (isNowComplete) {
      const currentEx = updated[exIdx];
      
      // Handle Superset Timer Logic
      let shouldStartTimer = true;
      if (currentEx.supersetId) {
        const ssGroup = updated.filter(e => e.supersetId === currentEx.supersetId);
        const lastInGroup = ssGroup[ssGroup.length - 1];
        // Only trigger rest if this is the last exercise in the superset
        if (currentEx.instanceId !== lastInGroup.instanceId) {
          shouldStartTimer = false;
        }
      }

      if (shouldStartTimer) {
        startRestTimer(90);
      }
      
      // Save history automatically
      const completedSet = currentEx.sets[setIdx];
      if (completedSet.weight || completedSet.reps) {
        setHistory(prev => ({
          ...prev,
          [currentEx.id]: { 
            weight: completedSet.weight, 
            reps: completedSet.reps 
          }
        }));
      }
    }
  };

  const addSet = (exIdx) => {
    const updated = [...workoutPlan];
    const currentEx = updated[exIdx];
    const lastSet = currentEx.sets[currentEx.sets.length - 1];
    
    currentEx.sets.push({
      id: `${currentEx.id}-s${Date.now()}`,
      weight: lastSet ? lastSet.weight : '',
      reps: lastSet ? lastSet.reps : currentEx.defaultReps,
      completed: false
    });
    
    setWorkoutPlan(updated);
  };

  // --- SWAPPING & ADDING HANDLERS ---
  const handleSelectExercise = (newExerciseDef) => {
    const newExercise = generateWorkoutExercise(newExerciseDef);
    const updated = [...workoutPlan];
    
    if (exerciseModal.type === 'SWAP' && exerciseModal.targetIdx !== null) {
      // Retain superset ID if it was part of one
      newExercise.supersetId = updated[exerciseModal.targetIdx].supersetId;
      updated[exerciseModal.targetIdx] = newExercise;
    } else if (exerciseModal.type === 'ADD') {
      updated.push(newExercise);
    }
    
    setWorkoutPlan(updated);
    setExerciseModal({ isOpen: false, type: null, targetIdx: null });
  };

  // --- TIMER LOGIC ---
  const startRestTimer = (seconds) => {
    setRestEndTime(Date.now() + seconds * 1000);
    setRestRemainingMs(seconds * 1000);
  };

  const stopRestTimer = () => {
    setRestEndTime(null);
    setRestRemainingMs(0);
  };

  useEffect(() => {
    let interval;
    if (restEndTime) {
      interval = setInterval(() => {
        const now = Date.now();
        const remaining = Math.max(0, restEndTime - now);
        setRestRemainingMs(remaining);
        
        if (remaining <= 0) {
          stopRestTimer();
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate([200, 100, 200]);
          }
        }
      }, 100);
    }
    return () => clearInterval(interval);
  }, [restEndTime]);

  // --- VIEWS ---

  const SetupView = () => (
    <div className="flex flex-col h-full overflow-y-auto pb-8 bg-[#1E1410]">
      <div className="p-6 pt-12 pb-8 bg-[#2D1D16] border-b border-[#593D2C] rounded-b-[40px] mb-6 shadow-xl">
        <h1 className="text-4xl font-black tracking-tighter text-[#F5EDE6] flex items-center gap-2">
          Fit<span className="text-[#AF4722]">Forge</span>
        </h1>
        <p className="text-[#D1B8A3] font-medium mt-1">Configure your session.</p>
      </div>

      <div className="space-y-8 px-6">
        <section>
          <h2 className="text-sm font-bold text-[#D1B8A3] mb-3 flex items-center gap-2">
            <Clock size={16} className="text-[#AF4722]" /> Duration
          </h2>
          <div className="flex bg-[#2D1D16] rounded-xl p-1 border border-[#593D2C]">
            {[20, 30, 45, 60].map(t => (
              <button 
                key={t}
                onClick={() => setTimeMode(t)}
                className={`flex-1 py-3 rounded-lg font-bold text-sm transition-all ${timeMode === t ? 'bg-[#AF4722] text-[#F5EDE6] shadow-md' : 'text-[#D1B8A3] hover:text-[#F5EDE6]'}`}
              >
                {t}m
              </button>
            ))}
          </div>
        </section>

        <section>
          <h2 className="text-sm font-bold text-[#D1B8A3] mb-3 flex items-center gap-2">
            <Activity size={16} className="text-[#AF4722]" /> Muscle Group Focus
          </h2>
          <div className="grid grid-cols-2 gap-3">
            {['Full Body', 'Upper Body', 'Lower Body', 'Core Focus'].map(f => (
              <button 
                key={f}
                onClick={() => setFocusArea(f)}
                className={`p-4 rounded-2xl flex flex-col items-start gap-1 border-2 transition-all ${focusArea === f ? 'border-[#AF4722] bg-[#5E2B16] text-[#F5EDE6]' : 'border-[#593D2C] bg-[#2D1D16] text-[#D1B8A3] hover:border-[#7A543E]'}`}
              >
                <div className="font-bold">{f}</div>
              </button>
            ))}
          </div>
        </section>

        <section>
          <h2 className="text-sm font-bold text-[#D1B8A3] mb-3 flex items-center gap-2">
            <Dumbbell size={16} className="text-[#AF4722]" /> Equipment Profile
          </h2>
          <div className="flex flex-col gap-2">
            {['Full Gym', 'Dumbbells', 'Bodyweight'].map(eq => (
              <button 
                key={eq}
                onClick={() => setEquipment(eq)}
                className={`px-4 py-4 rounded-xl font-bold text-sm text-left transition-all border ${equipment === eq ? 'bg-[#5E2B16] text-[#F5EDE6] border-[#AF4722]' : 'bg-[#2D1D16] text-[#D1B8A3] border-[#593D2C]'}`}
              >
                {eq}
              </button>
            ))}
          </div>
        </section>

        <button 
          onClick={generateWorkout}
          className="w-full bg-[#AF4722] hover:bg-[#C8562B] text-[#F5EDE6] font-black text-lg py-5 rounded-2xl shadow-[0_10px_30px_rgba(175,71,34,0.3)] active:scale-95 transition-all mt-4"
        >
          START WORKOUT
        </button>
      </div>
    </div>
  );

  const WorkoutView = () => {
    const isWorkoutComplete = workoutPlan.length > 0 && workoutPlan.every(ex => ex.sets.every(set => set.completed));

    // Group exercises for superset rendering
    const groupedWorkout = [];
    let currentGroup = null;
    
    workoutPlan.forEach((ex, idx) => {
      if (ex.supersetId) {
        if (currentGroup && currentGroup.supersetId === ex.supersetId) {
          currentGroup.items.push({ ...ex, originalIdx: idx });
        } else {
          currentGroup = { isSuperset: true, supersetId: ex.supersetId, items: [{ ...ex, originalIdx: idx }] };
          groupedWorkout.push(currentGroup);
        }
      } else {
        currentGroup = null;
        groupedWorkout.push({ isSuperset: false, items: [{ ...ex, originalIdx: idx }] });
      }
    });

    return (
      <div className="flex flex-col h-full bg-[#1E1410] relative">
        <header className="flex justify-between items-center py-4 px-4 bg-[#2D1D16] border-b border-[#593D2C] sticky top-0 z-10 shadow-md">
          <div>
            <h2 className="text-lg font-black text-[#F5EDE6]">{focusArea}</h2>
            <p className="text-xs text-[#E37036] font-bold">{timeMode} MIN</p>
          </div>
          <button 
            onClick={() => setCurrentView('summary')}
            className="text-xs font-bold text-[#D1B8A3] bg-[#3E291F] px-4 py-2 rounded-full active:bg-[#593D2C]"
          >
            Finish
          </button>
        </header>

        <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-40">
          
          {groupedWorkout.map((group, groupIdx) => (
            <div 
              key={group.isSuperset ? group.supersetId : `single-${group.items[0].instanceId}`}
              className={group.isSuperset ? "border-l-4 border-[#AF4722] pl-3 py-1 -ml-3 relative" : ""}
            >
              {group.isSuperset && (
                <div className="text-[10px] font-black text-[#E37036] tracking-widest uppercase mb-2 flex items-center gap-1">
                  <Link2 size={12} /> SUPERSET
                </div>
              )}

              <div className="space-y-4">
                {group.items.map((ex, idxInGroup) => {
                  const exIdx = ex.originalIdx;
                  return (
                    <div key={ex.instanceId} className="relative">
                      <div className="bg-[#2D1D16] border border-[#593D2C] rounded-2xl overflow-hidden shadow-lg transition-all">
                        
                        {/* Card Header */}
                        <div className="p-4 bg-[#3E291F]/50 flex justify-between items-center">
                          <div 
                            className="flex-1 cursor-pointer flex items-center gap-3" 
                            onClick={() => toggleSetExpansion(exIdx)}
                          >
                            <div className={`p-2 rounded-full ${ex.isExpanded ? 'bg-[#593D2C] text-[#F5EDE6]' : 'bg-[#1E1410] text-[#D1B8A3]'}`}>
                              {ex.isExpanded ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                            </div>
                            <div>
                              <h3 className="font-bold text-[#F5EDE6] leading-tight">{ex.name}</h3>
                              <span className="text-[10px] font-bold uppercase text-[#D1B8A3]">{ex.category}</span>
                            </div>
                          </div>
                          <button 
                            onClick={() => setExerciseModal({ isOpen: true, type: 'SWAP', targetIdx: exIdx })}
                            className="ml-2 flex items-center gap-1 text-[10px] font-bold text-[#D1B8A3] bg-[#3E291F] hover:bg-[#593D2C] px-3 py-2 rounded-lg active:scale-95 transition-colors"
                          >
                            <ArrowLeftRight size={14} /> SWAP
                          </button>
                        </div>

                        {/* Sets Area */}
                        {ex.isExpanded && (
                          <div className="p-2 pt-0 pb-4">
                            <div className="grid grid-cols-12 gap-2 px-3 py-2 text-[10px] font-bold text-[#C4A68D] uppercase tracking-wider">
                              <div className="col-span-2 text-center">Set</div>
                              <div className="col-span-4 text-center">lbs</div>
                              <div className="col-span-4 text-center">Reps</div>
                              <div className="col-span-2 text-center"><Check size={14} className="mx-auto" /></div>
                            </div>

                            {ex.sets.map((set, setIdx) => (
                              <div 
                                key={set.id} 
                                className={`grid grid-cols-12 gap-2 px-2 py-2 items-center rounded-lg transition-colors ${set.completed ? 'bg-[#5E2B16]/40' : ''}`}
                              >
                                <div className="col-span-2 text-center font-bold text-[#D1B8A3] text-sm">
                                  {setIdx + 1}
                                </div>
                                <div className="col-span-4">
                                  <input 
                                    type="number" 
                                    placeholder="-"
                                    value={set.weight}
                                    onChange={(e) => updateSetData(exIdx, setIdx, 'weight', e.target.value)}
                                    disabled={set.completed}
                                    className={`w-full bg-[#1E1410] font-bold py-2 px-1 text-center rounded-lg border focus:outline-none ${set.completed ? 'text-[#E37036] border-transparent opacity-50' : 'text-[#F5EDE6] border-[#593D2C] focus:border-[#AF4722]'}`}
                                  />
                                </div>
                                <div className="col-span-4">
                                  <input 
                                    type="number" 
                                    placeholder="-"
                                    value={set.reps}
                                    onChange={(e) => updateSetData(exIdx, setIdx, 'reps', e.target.value)}
                                    disabled={set.completed}
                                    className={`w-full bg-[#1E1410] font-bold py-2 px-1 text-center rounded-lg border focus:outline-none ${set.completed ? 'text-[#E37036] border-transparent opacity-50' : 'text-[#F5EDE6] border-[#593D2C] focus:border-[#AF4722]'}`}
                                  />
                                </div>
                                <div className="col-span-2 flex justify-center">
                                  <button 
                                    onClick={() => toggleSetComplete(exIdx, setIdx)}
                                    className={`w-8 h-8 rounded-lg flex items-center justify-center transition-all ${set.completed ? 'bg-[#AF4722] text-[#F5EDE6] shadow-[0_0_10px_rgba(175,71,34,0.4)]' : 'bg-[#3E291F] text-[#D1B8A3] hover:bg-[#593D2C]'}`}
                                  >
                                    {set.completed && <Check size={16} strokeWidth={3} />}
                                  </button>
                                </div>
                              </div>
                            ))}
                            
                            <div className="px-2 mt-2">
                              <button 
                                onClick={() => addSet(exIdx)}
                                className="w-full py-2 text-xs font-bold text-[#D1B8A3] bg-[#1E1410] rounded-lg hover:text-[#F5EDE6] transition-colors border border-dashed border-[#593D2C]"
                              >
                                + ADD SET
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                      
                      {/* Superset Linker Button */}
                      {exIdx < workoutPlan.length - 1 && (
                        <div className="absolute -bottom-6 left-1/2 transform -translate-x-1/2 z-20 pb-2">
                          <button
                            onClick={() => toggleSuperset(exIdx)}
                            className={`p-1.5 rounded-full border shadow-sm transition-colors ${
                              isLinkedToNext(exIdx) 
                                ? 'bg-[#AF4722] text-[#F5EDE6] border-[#C8562B]' 
                                : 'bg-[#2D1D16] text-[#D1B8A3] border-[#593D2C] hover:text-[#E37036]'
                            }`}
                          >
                            {isLinkedToNext(exIdx) ? <Unlink size={16} /> : <Link2 size={16} />}
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          {/* Add Exercise Button */}
          <div className="mt-8 pt-4">
            <button 
              onClick={() => setExerciseModal({ isOpen: true, type: 'ADD', targetIdx: null })}
              className="w-full py-4 border-2 border-dashed border-[#593D2C] rounded-2xl text-[#D1B8A3] font-bold flex justify-center items-center gap-2 hover:bg-[#2D1D16] hover:text-[#E37036] transition-colors"
            >
              <Plus size={20} /> ADD EXERCISE
            </button>
          </div>

          {isWorkoutComplete && (
            <button 
              onClick={() => setCurrentView('summary')}
              className="w-full mt-8 py-5 bg-[#AF4722] text-[#F5EDE6] font-black rounded-2xl active:scale-95 shadow-lg"
            >
              FINISH WORKOUT
            </button>
          )}
        </div>

        {/* Floating Rest Timer */}
        {restRemainingMs > 0 && (
          <div className="fixed bottom-6 left-4 right-4 bg-[#2D1D16] border border-[#593D2C] p-4 rounded-2xl shadow-2xl flex items-center justify-between z-40 backdrop-blur-md bg-opacity-95">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-[#5E2B16]/50 text-[#E37036] rounded-full flex items-center justify-center animate-pulse">
                <Clock size={20} />
              </div>
              <div>
                <div className="text-xs font-bold text-[#D1B8A3] uppercase">Rest Timer</div>
                <div className="text-2xl font-black text-[#F5EDE6] leading-none">
                  {Math.floor(restRemainingMs / 1000)}s
                </div>
              </div>
            </div>
            <button 
              onClick={stopRestTimer}
              className="px-6 py-3 bg-[#3E291F] text-[#F5EDE6] font-bold text-sm rounded-xl active:bg-[#593D2C]"
            >
              Skip
            </button>
            <div 
              className="absolute bottom-0 left-0 h-1 bg-[#AF4722] rounded-b-2xl transition-all duration-100 ease-linear"
              style={{ width: `${(restRemainingMs / 90000) * 100}%` }}
            />
          </div>
        )}

        {/* Global Swap / Add Modal */}
        {exerciseModal.isOpen && (
          <div className="absolute inset-0 z-50 bg-[#1E1410]/95 backdrop-blur-md flex flex-col animate-in fade-in slide-in-from-bottom-4">
            <header className="flex justify-between items-center py-4 px-4 border-b border-[#593D2C] bg-[#2D1D16]">
              <div>
                <h2 className="text-lg font-black text-[#F5EDE6]">
                  {exerciseModal.type === 'SWAP' ? 'Swap Exercise' : 'Add Exercise'}
                </h2>
                <p className="text-xs text-[#C4A68D] font-bold uppercase">
                  Select from database
                </p>
              </div>
              <button 
                onClick={() => setExerciseModal({ isOpen: false, type: null, targetIdx: null })} 
                className="p-2 bg-[#1E1410] text-[#D1B8A3] hover:text-[#F5EDE6] rounded-full"
              >
                <X size={20} />
              </button>
            </header>
            
            <div className="flex-1 overflow-y-auto p-4 space-y-6">
              {CATEGORIES.map(category => (
                <div key={category}>
                  <h3 className="text-[#E37036] font-bold text-sm mb-3 tracking-widest uppercase border-b border-[#593D2C] pb-1">
                    {category} Body
                  </h3>
                  <div className="space-y-2">
                    {EXERCISE_DB
                      .filter(ex => ex.category === category)
                      .map(alt => (
                        <button 
                          key={alt.id}
                          onClick={() => handleSelectExercise(alt)}
                          className="w-full text-left bg-[#2D1D16] border border-[#593D2C] p-4 rounded-xl flex justify-between items-center active:bg-[#3E291F] hover:border-[#AF4722] transition-colors"
                        >
                          <div>
                            <div className="font-bold text-[#F5EDE6]">{alt.name}</div>
                            <div className="text-xs text-[#D1B8A3] mt-1">{alt.equipment}</div>
                          </div>
                          {exerciseModal.type === 'SWAP' ? (
                            <ArrowLeftRight size={16} className="text-[#AF4722]" />
                          ) : (
                            <Plus size={16} className="text-[#AF4722]" />
                          )}
                        </button>
                      ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  };

  const SummaryView = () => {
    const elapsedMinutes = workoutStartTime 
      ? Math.round((Date.now() - workoutStartTime) / 60000) 
      : 0;

    return (
      <div className="flex flex-col h-full bg-[#1E1410] p-6 justify-center items-center text-center">
        <div className="w-24 h-24 bg-[#5E2B16]/30 text-[#E37036] rounded-full flex justify-center items-center mb-8 border-4 border-[#AF4722]/20 shadow-[0_0_50px_rgba(175,71,34,0.15)]">
          <Flame size={48} />
        </div>
        
        <h2 className="text-4xl font-black text-[#F5EDE6] mb-2 tracking-tight">Workout<br/>Complete</h2>
        
        <div className="bg-[#2D1D16] border border-[#593D2C] rounded-2xl p-6 w-full max-w-xs mt-6 mb-10 shadow-lg">
          <div className="text-[#D1B8A3] text-xs font-bold uppercase tracking-widest mb-1">Time Elapsed</div>
          <div className="text-3xl font-black text-[#F5EDE6]">{elapsedMinutes} <span className="text-lg text-[#C4A68D]">MIN</span></div>
        </div>
        
        <button 
          onClick={() => setCurrentView('setup')}
          className="w-full py-5 bg-[#2D1D16] text-[#F5EDE6] font-black text-lg rounded-2xl flex justify-center items-center gap-3 active:scale-95 border border-[#593D2C] hover:bg-[#3E291F] transition-all shadow-md"
        >
          <Home size={20} /> RETURN HOME
        </button>
      </div>
    );
  };

  return (
    <div className="w-full min-h-screen bg-[#1A110D] text-[#F5EDE6] font-sans flex justify-center selection:bg-[#AF4722]/30">
      <div className="w-full max-w-md h-screen relative shadow-2xl overflow-hidden flex flex-col sm:border-x sm:border-[#593D2C] bg-[#1E1410]">
        {currentView === 'setup' && <SetupView />}
        {currentView === 'workout' && <WorkoutView />}
        {currentView === 'summary' && <SummaryView />}
      </div>
    </div>
  );
}
    // Render the app to the screen
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    
  </script>
</body>
</html>
